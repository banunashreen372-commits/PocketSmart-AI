<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Party Budget Planner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="planner-container">

    <h1>🎉 Party Budget Planner</h1>

    <p>Plan your party expenses easily.</p>


    <label>Total Party Budget (₹)</label>

    <input type="number"
           id="budget"
           placeholder="Enter total budget">


    <label>Food Expense (₹)</label>

    <input type="number"
           id="food"
           placeholder="Enter food cost">


    <label>Decoration Expense (₹)</label>

    <input type="number"
           id="decoration"
           placeholder="Enter decoration cost">


    <label>Venue Expense (₹)</label>

    <input type="number"
           id="venue"
           placeholder="Enter venue cost">


    <label>Entertainment Expense (₹)</label>

    <input type="number"
           id="entertainment"
           placeholder="Enter entertainment cost">


    <label>Other Expense (₹)</label>

    <input type="number"
           id="other"
           placeholder="Enter other cost">


    <button onclick="calculateParty()">
        Calculate Budget
    </button>


    <div id="party-result"
         class="result">
    </div>


    <br>

    <a href="/">⬅ Back to Home</a>

</div>


<script>

function calculateParty() {

    let budget =
        Number(document.getElementById("budget").value);

    let food =
        Number(document.getElementById("food").value);

    let decoration =
        Number(document.getElementById("decoration").value);

    let venue =
        Number(document.getElementById("venue").value);

    let entertainment =
        Number(document.getElementById("entertainment").value);

    let other =
        Number(document.getElementById("other").value);


    if (budget <= 0) {

        document.getElementById("party-result").innerHTML =
            "<p>Please enter a valid party budget.</p>";

        return;
    }


    let total =
        food +
        decoration +
        venue +
        entertainment +
        other;


    let remaining =
        budget - total;


    let status;


    if (remaining >= 0) {

        status =
            "✅ Your party is within the budget.";

    } else {

        status =
            "⚠️ Your party expenses exceed the budget.";
    }


    document.getElementById("party-result").innerHTML = `

        <h2>Party Budget Result</h2>

        <p>Total Budget:
        ₹${budget.toFixed(2)}</p>

        <p>Total Expenses:
        ₹${total.toFixed(2)}</p>

        <h3>
        Remaining:
        ₹${remaining.toFixed(2)}
        </h3>

        <p>${status}</p>

    `;
}

</script>

</body>
</html>
